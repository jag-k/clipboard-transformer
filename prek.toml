#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  # The compiled macOS asset catalog is generated and committed so packaged
  # apps do not depend on Xcode's asset compiler at release time.
  { id = "check-added-large-files", exclude = "^assets/generated/macos/Assets\\.car$" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  # The release pipeline handles Developer ID `.p12`, App Store Connect `.p8`,
  # and AUR SSH keys. `.gitignore` covers those extensions; this covers a key
  # pasted into a doc, test fixture, or workflow.
  { id = "detect-private-key" },
  # These three rewrite bytes, so they must never touch the raw RGBA pixel
  # buffers generated by `just gen-icons`.
  { id = "end-of-file-fixer", exclude = "\\.rgba$" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "\\.rgba$" },
  { id = "trailing-whitespace", exclude = "\\.rgba$" }
]

# The release and CI workflows carry a large amount of shell in `run:` blocks.
# actionlint checks the workflow expressions and runs shellcheck over those
# blocks; the standalone packaging scripts are not covered by it.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.7"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.18.1"
hooks = [{ id = "markdownlint-cli2" }]

# PKGBUILD is excluded: makepkg injects `pkgdir`/`srcdir` and consumes the
# metadata assignments itself, so shellcheck reports every one of them as
# unassigned or unused.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [{ id = "shellcheck", exclude = "(^|/)PKGBUILD$" }]

# Cargo hooks delegate to `just` so the flags live in exactly one place. The
# Justfile, this file, and .github/workflows/ci.yml previously each carried
# their own copy of the same cargo invocations.
#
# `files` must not anchor `Cargo.toml` to the repository root: the workspace has
# eleven more manifests under crates/, apps/, tools/, and plugins/, and a
# root-anchored pattern silently skipped every dependency edit in them.
[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "just check-fmt",
    files = "((^|/)Cargo\\.(toml|lock)$|\\.rs$)",
    pass_filenames = false
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "just check-clippy",
    files = "((^|/)Cargo\\.(toml|lock)$|\\.rs$)",
    pass_filenames = false
  },
  {
    id = "cargo-test",
    name = "cargo test",
    language = "system",
    entry = "just test",
    files = "((^|/)Cargo\\.(toml|lock)$|\\.rs$)",
    pass_filenames = false,
    stages = ["pre-push"]
  }
]
