name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_enabled: ${{ steps.release.outputs.release_enabled }}
      macos_enabled: ${{ steps.release.outputs.macos_enabled }}
      windows_enabled: ${{ steps.release.outputs.windows_enabled }}
      linux_enabled: ${{ steps.release.outputs.linux_enabled }}
      homebrew_enabled: ${{ steps.release.outputs.homebrew_enabled }}
      flatpak_publish_enabled: ${{ steps.release.outputs.flatpak_publish_enabled }}
      scoop_enabled: ${{ steps.release.outputs.scoop_enabled }}
      aur_enabled: ${{ steps.release.outputs.aur_enabled }}
      winget_enabled: ${{ steps.release.outputs.winget_enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: release
        name: Check release configuration
        shell: bash
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          MACOS_RELEASE_ENABLED: ${{ vars.MACOS_RELEASE_ENABLED }}
          WINDOWS_RELEASE_ENABLED: ${{ vars.WINDOWS_RELEASE_ENABLED }}
          LINUX_RELEASE_ENABLED: ${{ vars.LINUX_RELEASE_ENABLED }}
          HOMEBREW_PUBLISH_ENABLED: ${{ vars.HOMEBREW_PUBLISH_ENABLED }}
          FLATPAK_PUBLISH_ENABLED: ${{ vars.FLATPAK_PUBLISH_ENABLED }}
          SCOOP_PUBLISH_ENABLED: ${{ vars.SCOOP_PUBLISH_ENABLED }}
          AUR_PUBLISH_ENABLED: ${{ vars.AUR_PUBLISH_ENABLED }}
          WINGET_PUBLISH_ENABLED: ${{ vars.WINGET_PUBLISH_ENABLED }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          FLATPAK_REPOSITORY_TOKEN: ${{ secrets.FLATPAK_REPOSITORY_TOKEN }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          check_switch() {
            local name="$1"
            local value="$2"
            if [[ "${value}" != "true" && "${value}" != "false" ]]; then
              echo "${name} must be explicitly set to true or false" >&2
              exit 1
            fi
          }

          require_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "${value}" ]]; then
              echo "${name} is required by the enabled release configuration" >&2
              exit 1
            fi
          }

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "ct-runtime") | .version'
          )"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} must exactly match Cargo version v${version}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

          check_switch RELEASE_ENABLED "${RELEASE_ENABLED}"
          if [[ "${RELEASE_ENABLED}" == "false" ]]; then
            echo "Release is disabled by RELEASE_ENABLED=false"
            echo "release_enabled=false" >> "${GITHUB_OUTPUT}"
            for output in \
              macos_enabled windows_enabled linux_enabled \
              homebrew_enabled flatpak_publish_enabled scoop_enabled \
              aur_enabled winget_enabled; do
              echo "${output}=false" >> "${GITHUB_OUTPUT}"
            done
            exit 0
          fi

          check_switch MACOS_RELEASE_ENABLED "${MACOS_RELEASE_ENABLED}"
          check_switch WINDOWS_RELEASE_ENABLED "${WINDOWS_RELEASE_ENABLED}"
          check_switch LINUX_RELEASE_ENABLED "${LINUX_RELEASE_ENABLED}"
          check_switch HOMEBREW_PUBLISH_ENABLED "${HOMEBREW_PUBLISH_ENABLED}"
          check_switch FLATPAK_PUBLISH_ENABLED "${FLATPAK_PUBLISH_ENABLED}"
          check_switch SCOOP_PUBLISH_ENABLED "${SCOOP_PUBLISH_ENABLED}"
          check_switch AUR_PUBLISH_ENABLED "${AUR_PUBLISH_ENABLED}"
          check_switch WINGET_PUBLISH_ENABLED "${WINGET_PUBLISH_ENABLED}"

          if [[
            "${MACOS_RELEASE_ENABLED}" == "false" &&
            "${WINDOWS_RELEASE_ENABLED}" == "false" &&
            "${LINUX_RELEASE_ENABLED}" == "false"
          ]]; then
            echo "At least one release platform must be enabled" >&2
            exit 1
          fi

          if [[
            "${HOMEBREW_PUBLISH_ENABLED}" == "true" &&
            "${MACOS_RELEASE_ENABLED}" != "true"
          ]]; then
            echo "HOMEBREW_PUBLISH_ENABLED=true requires MACOS_RELEASE_ENABLED=true" >&2
            exit 1
          fi
          if [[
            ("${SCOOP_PUBLISH_ENABLED}" == "true" ||
              "${WINGET_PUBLISH_ENABLED}" == "true") &&
            "${WINDOWS_RELEASE_ENABLED}" != "true"
          ]]; then
            echo "Scoop and WinGet publication require WINDOWS_RELEASE_ENABLED=true" >&2
            exit 1
          fi
          if [[
            "${AUR_PUBLISH_ENABLED}" == "true" &&
            "${LINUX_RELEASE_ENABLED}" != "true"
          ]]; then
            echo "AUR_PUBLISH_ENABLED=true requires LINUX_RELEASE_ENABLED=true" >&2
            exit 1
          fi
          if [[
            "${FLATPAK_PUBLISH_ENABLED}" == "true" &&
            "${LINUX_RELEASE_ENABLED}" != "true"
          ]]; then
            echo "FLATPAK_PUBLISH_ENABLED=true requires LINUX_RELEASE_ENABLED=true" >&2
            exit 1
          fi

          if [[ "${MACOS_RELEASE_ENABLED}" == "true" ]]; then
            require_secret APPLE_CERTIFICATE "${APPLE_CERTIFICATE}"
            require_secret APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD}"
            require_secret APPLE_API_KEY_P8 "${APPLE_API_KEY_P8}"
            require_secret APPLE_API_KEY_ID "${APPLE_API_KEY_ID}"
            require_secret APPLE_API_ISSUER_ID "${APPLE_API_ISSUER_ID}"
          fi

          if [[ "${prerelease}" == "false" ]]; then
            if [[ "${HOMEBREW_PUBLISH_ENABLED}" == "true" ]]; then
              require_secret HOMEBREW_TAP_TOKEN "${HOMEBREW_TAP_TOKEN}"
            fi
            if [[ "${FLATPAK_PUBLISH_ENABLED}" == "true" ]]; then
              require_secret FLATPAK_REPOSITORY_TOKEN "${FLATPAK_REPOSITORY_TOKEN}"
              require_secret FLATPAK_GPG_KEY_ID "${FLATPAK_GPG_KEY_ID}"
              require_secret FLATPAK_GPG_PRIVATE_KEY "${FLATPAK_GPG_PRIVATE_KEY}"
            fi
            if [[ "${SCOOP_PUBLISH_ENABLED}" == "true" ]]; then
              require_secret SCOOP_BUCKET_TOKEN "${SCOOP_BUCKET_TOKEN}"
            fi
            if [[ "${AUR_PUBLISH_ENABLED}" == "true" ]]; then
              require_secret AUR_SSH_PRIVATE_KEY "${AUR_SSH_PRIVATE_KEY}"
            fi
            if [[ "${WINGET_PUBLISH_ENABLED}" == "true" ]]; then
              require_secret WINGET_CREATE_GITHUB_TOKEN "${WINGET_CREATE_GITHUB_TOKEN}"
            fi
          fi

          echo "release_enabled=true" >> "${GITHUB_OUTPUT}"
          echo "macos_enabled=${MACOS_RELEASE_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "windows_enabled=${WINDOWS_RELEASE_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "linux_enabled=${LINUX_RELEASE_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "homebrew_enabled=${HOMEBREW_PUBLISH_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "flatpak_publish_enabled=${FLATPAK_PUBLISH_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "scoop_enabled=${SCOOP_PUBLISH_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "aur_enabled=${AUR_PUBLISH_ENABLED}" >> "${GITHUB_OUTPUT}"
          echo "winget_enabled=${WINGET_PUBLISH_ENABLED}" >> "${GITHUB_OUTPUT}"

          printf '%s\n' \
            "Release configuration:" \
            "  macOS:   ${MACOS_RELEASE_ENABLED}" \
            "  Windows: ${WINDOWS_RELEASE_ENABLED}" \
            "  Linux:   ${LINUX_RELEASE_ENABLED}" \
            "  Homebrew (stable only): ${HOMEBREW_PUBLISH_ENABLED}" \
            "  Flatpak repo (stable only): ${FLATPAK_PUBLISH_ENABLED}" \
            "  Scoop (stable only):    ${SCOOP_PUBLISH_ENABLED}" \
            "  AUR (stable only):      ${AUR_PUBLISH_ENABLED}" \
            "  WinGet (stable only):   ${WINGET_PUBLISH_ENABLED}"

      # Preflight, not a release step: missing release notes used to surface
      # only after every platform runner had finished signing and notarizing.
      - name: Prepare release notes
        if: ${{ steps.release.outputs.release_enabled == 'true' }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          awk -v version="${VERSION}" '
            index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }
            found && (/^## \[/ || /^<!-- next-url -->/) {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 2
              }
            }
          ' CHANGELOG.md > release-notes/release-notes.md

          if ! grep -q '[^[:space:]]' release-notes/release-notes.md; then
            echo "CHANGELOG.md has no release notes for ${VERSION}" >&2
            exit 1
          fi

      - name: Upload release notes
        if: ${{ steps.release.outputs.release_enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes/release-notes.md
          if-no-files-found: error

  build-macos:
    needs: metadata
    if: ${{ needs.metadata.outputs.release_enabled == 'true' && needs.metadata.outputs.macos_enabled == 'true' }}
    uses: ./.github/workflows/build-macos-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
    permissions:
      attestations: write
      contents: read
      id-token: write

  build-windows:
    needs: metadata
    if: ${{ needs.metadata.outputs.release_enabled == 'true' && needs.metadata.outputs.windows_enabled == 'true' }}
    uses: ./.github/workflows/build-windows-msi.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
    permissions:
      attestations: write
      contents: read
      id-token: write

  build-linux:
    needs: metadata
    if: ${{ needs.metadata.outputs.release_enabled == 'true' && needs.metadata.outputs.linux_enabled == 'true' }}
    uses: ./.github/workflows/build-linux-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    permissions:
      attestations: write
      contents: read
      id-token: write

  build-flatpak:
    needs: metadata
    if: ${{ needs.metadata.outputs.release_enabled == 'true' && needs.metadata.outputs.linux_enabled == 'true' }}
    uses: ./.github/workflows/build-flatpak.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    permissions:
      attestations: write
      contents: read
      id-token: write

  github-release:
    needs:
      - metadata
      - build-macos
      - build-windows
      - build-linux
      - build-flatpak
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.metadata.outputs.release_enabled == 'true' &&
        (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
        (needs.build-flatpak.result == 'success' || needs.build-flatpak.result == 'skipped')
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      # Extracted and validated by the metadata preflight job.
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Prepare source archive
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="artifacts/clipboard-transformer-${VERSION}.tar.gz"
          git archive \
            --format=tar \
            --prefix="clipboard-transformer-${VERSION}/" \
            "${GITHUB_SHA}" | gzip -n >"${archive}"
          sha256sum "${archive}" >"${archive}.sha256"
          cp LICENSE artifacts/LICENSE

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "${{ needs.metadata.outputs.tag }}"
            --target "${GITHUB_SHA}"
            --title "${{ needs.metadata.outputs.version }}"
            --notes-file release-notes/release-notes.md
          )
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" artifacts/*

  publish-homebrew:
    needs:
      - metadata
      - github-release
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.homebrew_enabled == 'true' }}
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  publish-flatpak:
    needs:
      - metadata
      - github-release
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.flatpak_publish_enabled == 'true' }}
    uses: ./.github/workflows/publish-flatpak.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  publish-scoop:
    needs:
      - metadata
      - github-release
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.scoop_enabled == 'true' }}
    uses: ./.github/workflows/publish-scoop.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  publish-aur:
    needs:
      - metadata
      - github-release
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.aur_enabled == 'true' }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  publish-winget:
    needs:
      - metadata
      - github-release
    if: ${{ needs.metadata.outputs.prerelease != 'true' && needs.metadata.outputs.winget_enabled == 'true' }}
    uses: ./.github/workflows/publish-winget.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
