name: Publish Flatpak repository

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      artifact_name:
        description: Artifact from the current workflow run; empty downloads from the release
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Stable version whose Flatpak artifact should be published
        required: true
        type: string
      tag:
        description: GitHub Release tag containing the Flatpak bundle
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      APP_ID: dev.jagk.clipboard_transformer
      # The ID earlier releases were published under; see the end-of-life step.
      LEGACY_APP_ID: dev.jag_k.clipboard_transformer
      FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      FLATPAK_REPOSITORY_TOKEN: ${{ secrets.FLATPAK_REPOSITORY_TOKEN }}
      REPOSITORY_URL: https://flatpak.jag-k.dev/
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check publishing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            FLATPAK_GPG_KEY_ID \
            FLATPAK_GPG_PRIVATE_KEY \
            FLATPAK_REPOSITORY_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is required for Flatpak repository publication" >&2
              exit 1
            fi
          done

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Checkout shared Flatpak repository
        uses: actions/checkout@v6
        with:
          repository: jag-k/flatpak-repo
          token: ${{ secrets.FLATPAK_REPOSITORY_TOKEN }}
          path: site
          persist-credentials: true

      - name: Download Flatpak bundle artifact
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: bundles

      - name: Download Flatpak bundle from release
        if: ${{ inputs.artifact_name == '' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="clipboard-transformer-${VERSION}-x86_64.flatpak"
          mkdir -p bundles
          curl --fail --location --silent --show-error \
            "https://github.com/jag-k/clipboard-transformer/releases/download/${TAG}/${bundle}" \
            --output "bundles/${bundle}"

      - name: Import signing key
        shell: bash
        run: |
          set -euo pipefail
          gpg_home="${RUNNER_TEMP}/flatpak-gnupg"
          install -d -m 0700 "${gpg_home}"
          printf '%s\n' "${FLATPAK_GPG_PRIVATE_KEY}" \
            > "${RUNNER_TEMP}/flatpak-private-key.asc"
          gpg --batch --homedir "${gpg_home}" \
            --import "${RUNNER_TEMP}/flatpak-private-key.asc"
          gpg --batch --homedir "${gpg_home}" \
            --list-secret-keys "${FLATPAK_GPG_KEY_ID}"
          echo "GPG_HOME=${gpg_home}" >> "${GITHUB_ENV}"

      - name: Update signed repository
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find bundles -type f -name '*.flatpak' -print -quit)"
          if [[ -z "${bundle}" ]]; then
            echo "Flatpak bundle artifact is missing" >&2
            exit 1
          fi

          repository="site/repo"
          if [[ ! -f "${repository}/config" ]]; then
            ostree init --repo="${repository}" --mode=archive-z2
          fi
          # The published repository is stored in git, which cannot track empty
          # directories. Restore the ostree layout the checkout dropped so that
          # ref listing and static delta generation keep working.
          mkdir -p \
            "${repository}/refs/heads" \
            "${repository}/refs/mirrors" \
            "${repository}/refs/remotes" \
            "${repository}/extensions" \
            "${repository}/state" \
            "${repository}/tmp"
          # Sign at import time: --update-appstream commits the appstream
          # branches here, and build-update-repo later skips them when their
          # content is unchanged, so they would otherwise stay unsigned and
          # clients would reject the appstream pull.
          flatpak build-import-bundle \
            --update-appstream \
            --gpg-homedir="${GPG_HOME}" \
            --gpg-sign="${FLATPAK_GPG_KEY_ID}" \
            "${repository}" "${bundle}"
          # End-of-life the legacy ID once, rebased onto the current one, so
          # `flatpak update` offers installed copies the rename and migrates
          # their ~/.var/app data. The rebase target must already be in the
          # repository, hence after the import; the commit marker makes later
          # publishes skip this.
          legacy_ref="app/${LEGACY_APP_ID}/x86_64/stable"
          if ostree rev-parse --repo="${repository}" "${legacy_ref}" \
            > /dev/null 2>&1 \
            && ! ostree show --repo="${repository}" \
              --print-metadata-key=ostree.endoflife-rebase "${legacy_ref}" \
              > /dev/null 2>&1; then
            flatpak build-commit-from \
              --end-of-life="Renamed to ${APP_ID}" \
              --end-of-life-rebase="${LEGACY_APP_ID}=${APP_ID}" \
              --gpg-homedir="${GPG_HOME}" \
              --gpg-sign="${FLATPAK_GPG_KEY_ID}" \
              --src-ref="${legacy_ref}" \
              "${repository}" "${legacy_ref}"
          fi
          # Sign any published head that still lacks this key's signature,
          # including appstream commits left unsigned by earlier releases.
          # `ostree gpg-sign` appends duplicates, so check the key ID first.
          key_id="$(
            gpg --batch --homedir "${GPG_HOME}" --with-colons \
              --list-keys "${FLATPAK_GPG_KEY_ID}" \
              | awk -F: '/^fpr:/ { print substr($10, length($10) - 15); exit }'
          )"
          for ref in \
            "app/${APP_ID}/x86_64/stable" \
            appstream/x86_64 \
            appstream2/x86_64; do
            signatures="$(
              ostree show --repo="${repository}" \
                --gpg-homedir="${GPG_HOME}" "${ref}"
            )"
            if ! grep -qi "key ID ${key_id}" <<< "${signatures}"; then
              ostree gpg-sign --repo="${repository}" \
                --gpg-homedir="${GPG_HOME}" "${ref}" "${FLATPAK_GPG_KEY_ID}"
            fi
          done
          flatpak build-update-repo \
            --generate-static-deltas \
            --prune \
            --gpg-homedir="${GPG_HOME}" \
            --gpg-sign="${FLATPAK_GPG_KEY_ID}" \
            "${repository}"

          public_key="$(
            gpg --batch --homedir "${GPG_HOME}" \
              --export "${FLATPAK_GPG_KEY_ID}" | base64 --wrap=0
          )"
          source/package/flatpak/write-repository-descriptors.sh \
            site "${REPOSITORY_URL}" "${public_key}"

      - name: Commit repository update
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git add --all \
            .nojekyll \
            clipboard-transformer.flatpakref \
            icons \
            jag-k.flatpakrepo \
            repo
          if git diff --cached --quiet; then
            echo "Flatpak repository already contains ${VERSION}"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "clipboard-transformer ${VERSION}"
          git push
