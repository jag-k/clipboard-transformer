name: Build Flatpak

on:
  pull_request:
    paths:
      - ".github/actions/check-version/**"
      - ".github/actions/install-just/**"
      - ".github/workflows/build-flatpak.yml"
      - "apps/**"
      - "assets/generated/linux/**"
      - "assets/tray.svg"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "Justfile"
      - "package/flatpak/**"
  push:
    branches:
      - main
    paths:
      - ".github/actions/check-version/**"
      - ".github/actions/install-just/**"
      - ".github/workflows/build-flatpak.yml"
      - "apps/**"
      - "assets/generated/linux/**"
      - "assets/tray.svg"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "CHANGELOG.md"
      - "Justfile"
      - "package/flatpak/**"
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml and Flatpak metadata
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The container has no Rust toolchain; install-just downloads a release
      # binary and check-version reads the manifests without cargo.
      - name: Install just
        uses: ./.github/actions/install-just

      - name: Check package version
        id: version
        uses: ./.github/actions/check-version
        with:
          version: ${{ inputs.version }}

      # flatpak-builder builds offline, so both ignored inputs are generated
      # before it runs, exactly as `just package-flatpak` does locally.
      - name: Generate Flatpak inputs
        run: just gen-flatpak-sources gen-flatpak-metainfo

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: clipboard-transformer.flatpak
          manifest-path: package/flatpak/dev.jag_k.clipboard_transformer.json
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'package/flatpak/**') }}
          branch: stable
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          upload-artifact: false

      - name: Create checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="target/distrib-flatpak/clipboard-transformer-${VERSION}-x86_64.flatpak"
          mkdir -p target/distrib-flatpak
          mv clipboard-transformer.flatpak "${bundle}"
          just package-checksums "${bundle}"

      - name: Attest Flatpak bundle
        uses: actions/attest@v4
        with:
          subject-path: target/distrib-flatpak/*

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux-flatpak
          path: target/distrib-flatpak/*
          if-no-files-found: error
