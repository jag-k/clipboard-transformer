name: Nix

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/nix.yml"
      - "apps/**"
      - "assets/generated/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "package/linux/**"
      - "package/macos/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nix.yml"
      - "apps/**"
      - "assets/generated/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "package/linux/**"
      - "package/macos/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
          # Determinate Nix no longer ships an Intel-host installer. Install
          # pinned upstream Nix instead and build on GitHub's native Intel host.
          - runner: macos-15-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - uses: cachix/cachix-action@v17
        with:
          name: jag-k
          authToken: "${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          skipPush: "${{ github.event_name == 'pull_request' }}"
      - name: Build the default package
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = \
            "${{ matrix.system }}"
          nix build --print-build-logs ".#packages.${{ matrix.system }}.default"
