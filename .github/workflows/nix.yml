name: Nix

on:
  pull_request:
    paths:
      - ".github/workflows/nix.yml"
      - "apps/**"
      - "assets/generated/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "package/linux/**"
      - "package/macos/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nix.yml"
      - "apps/**"
      - "assets/generated/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "package/linux/**"
      - "package/macos/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: cachix/cachix-action@v17
        with:
          name: jag-k
          authToken: "${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          skipPush: "${{ github.event_name == 'pull_request' }}"
      - name: Build the default package
        run: nix build --print-build-logs .#default
