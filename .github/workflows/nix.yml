name: Nix

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/nix.yml"
      - "apps/**"
      - "assets/generated/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "package/linux/**"
      - "package/macos/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nix.yml"
      - "apps/**"
      - "assets/generated/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "package/linux/**"
      - "package/macos/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pull requests build Linux only: the two macOS systems would queue behind
    # every other macOS job for no extra signal over the CI workflow's macOS
    # build. Pushes to main, releases, and manual runs build all three.
    strategy:
      fail-fast: false
      matrix:
        system: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["x86_64-linux"]'
          || '["x86_64-linux", "aarch64-darwin", "x86_64-darwin"]') }}
    # Determinate Nix no longer ships an Intel-host installer. Install pinned
    # upstream Nix instead and build x86_64-darwin on GitHub's native Intel host.
    runs-on: >-
      ${{ matrix.system == 'x86_64-linux' && 'ubuntu-24.04'
      || matrix.system == 'aarch64-darwin' && 'macos-15'
      || 'macos-15-intel' }}
    # One group per system and ref: a newer pull-request push cancels the older
    # build, while running main and release builds are never cancelled.
    concurrency:
      group: nix-${{ matrix.system }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - uses: cachix/cachix-action@v17
        with:
          name: jag-k
          authToken: "${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"
          skipPush: "${{ github.event_name == 'pull_request' }}"
      - name: Build the default package
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = \
            "${{ matrix.system }}"
          nix build --print-build-logs ".#packages.${{ matrix.system }}.default"
