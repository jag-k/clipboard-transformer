name: CI

# Every verification step runs through a Justfile recipe so `just ci` locally
# and this workflow cannot drift apart. The recipes are in the `check`, `test`,
# and `build` groups of the root Justfile.
#
# Release workflows use only local actions, actions reviewed in full, and
# official or semi-official ones: published by GitHub, by the tool's vendor
# (astral-sh/setup-uv), or recommended by the tool's own documentation
# (extractions/setup-just, behind .github/actions/install-just).
# Swatinem/rust-cache meets none of these, so it is confined to this
# workflow, which holds no credentials and grants only `contents: read`; the
# release workflows build from a clean target directory.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # A new RUSTSEC advisory, or a new `stable` release that adds a clippy lint,
    # breaks the build without this repository changing. Weekly is enough to
    # find both before the next contributor does.
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Superseded pull-request runs are pointless; pushes to main are kept so every
# commit on the default branch keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run macOS and Windows only where they can catch something
  # Linux cannot: Rust sources and Cargo inputs for the portable jobs, Windows
  # packaging for the MSI and standalone jobs. Pushes to main, the weekly
  # schedule, and manual runs always run every job.
  changes:
    name: Changed paths
    runs-on: ubuntu-22.04
    outputs:
      os: ${{ steps.paths.outputs.os }}
      windows-packaging: ${{ steps.paths.outputs.windows-packaging }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all='["ubuntu-22.04","macos-14","windows-2025"]'
          if [[ "${EVENT}" != "pull_request" ]]; then
            echo "os=${all}" >> "${GITHUB_OUTPUT}"
            echo "windows-packaging=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          files="$(git diff --name-only "${BASE}...${HEAD}")"
          changed() { grep -qE "$1" <<<"${files}"; }
          # Platform code is spread across crates through cfg(target_os), so
          # any Rust or Cargo change needs the native compilers and tests.
          if changed '^(crates|apps|tools)/|^Cargo\.(toml|lock)$|^rust-toolchain|^\.cargo/|^Justfile$|^\.github/(workflows/ci\.yml|actions/)'; then
            echo "os=${all}" >> "${GITHUB_OUTPUT}"
          else
            echo 'os=["ubuntu-22.04"]' >> "${GITHUB_OUTPUT}"
          fi
          if changed '^package/windows/|^Packager\.toml$|^apps/desktop/|^crates/runtime/src/platform/windows/|^assets/generated/windows/|^\.cargo/|^Justfile$|^\.github/(workflows/ci\.yml|actions/)'; then
            echo "windows-packaging=true" >> "${GITHUB_OUTPUT}"
          else
            echo "windows-packaging=false" >> "${GITHUB_OUTPUT}"
          fi

  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install just
        uses: ./.github/actions/install-just
      - run: just check-fmt

  # One job per OS: clippy type-checks everything `check` does, and the tests
  # reuse the same build. Linux also runs the host-independent checks (the CLI
  # without default features and the browser WASM crates), so the union over
  # this workflow still covers every recipe in `just ci`.
  portable:
    name: ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          if [[ "${OS}" == ubuntu-* ]]; then
            rustup target add wasm32-unknown-unknown
          fi
      - name: Install just
        uses: ./.github/actions/install-just
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable
      - name: Verify
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          if [[ "${OS}" == ubuntu-* ]]; then
            just check check-cli check-wasm
          fi
          just check-clippy check-clippy-cli test

  deny:
    name: Dependency advisories and licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install just
        uses: ./.github/actions/install-just
      - name: Install cargo-deny
        uses: ./.github/actions/install-cargo-deny
      # A new advisory can land without this repository changing at all, so this
      # job is also the reason `schedule` exists on this workflow.
      - name: Check advisories, licenses, sources, and duplicates
        run: just check-deny

  msrv:
    name: MSRV
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install just
        uses: ./.github/actions/install-just
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # The recipe reads `rust-version` from Cargo.toml and installs that
      # toolchain, so raising the MSRV needs no workflow edit. Without this job
      # nothing checks that the declared minimum is still true.
      - name: Type-check on the declared MSRV
        run: just check-msrv

  plugins:
    name: Plugin runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust and the WASI target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
      - name: Install just
        uses: ./.github/actions/install-just
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugins
      # Without the built artifact the plugin runtime tests skip themselves, so
      # plain `cargo test` never exercises Extism, the embedded manifest, or the
      # host capability checks.
      - name: Build the example plugin and run the plugin runtime tests
        run: just test-plugins
      # The example plugin's build script refreshes its committed manifest. It
      # is not a workspace member, so the codegen drift tests cannot see it and
      # only an actual build detects a stale manifest.
      - name: Check the committed example plugin manifest is current
        run: git diff --exit-code plugins/gitlab-link/manifest.json

  linux-x11-runtime:
    name: Linux X11 runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth
      - name: Install just
        uses: ./.github/actions/install-just
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x11
      - name: Exercise the real X11 clipboard backend
        run: xvfb-run -a just test-linux-x11

  linux-wayland-runtime:
    name: Linux Wayland data-control runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust and headless wlroots compositor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes sway
      - name: Install just
        uses: ./.github/actions/install-just
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-wayland
      - name: Exercise the real wlr-data-control clipboard backend
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          chmod 700 "${runtime_dir}"
          export XDG_RUNTIME_DIR="${runtime_dir}"
          export WLR_BACKENDS=headless
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER=pixman
          sway --unsupported-gpu --config /dev/null >"${RUNNER_TEMP}/sway.log" 2>&1 &
          sway_pid=$!
          trap 'kill "${sway_pid}" 2>/dev/null || true; cat "${RUNNER_TEMP}/sway.log"' EXIT

          for _ in $(seq 1 100); do
            wayland_socket="$(find "${runtime_dir}" -maxdepth 1 -type s -name 'wayland-*' -print -quit)"
            if [[ -n "${wayland_socket}" ]]; then
              break
            fi
            sleep 0.1
          done
          if [[ -z "${wayland_socket:-}" ]]; then
            echo "headless sway did not create a Wayland socket" >&2
            exit 1
          fi
          export WAYLAND_DISPLAY="${wayland_socket##*/}"
          just test-linux-wayland

  windows-standalone:
    name: Windows standalone executable
    needs: changes
    if: needs.changes.outputs.windows-packaging == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install just
        uses: ./.github/actions/install-just
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-standalone
      - name: Build and stage the standalone executable
        run: just build-windows-standalone
      - uses: actions/upload-artifact@v7
        with:
          name: clipboard-transformer-windows-standalone
          path: target/windows/standalone

  windows-msi:
    name: Windows MSI
    needs: changes
    if: needs.changes.outputs.windows-packaging == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install just
        uses: ./.github/actions/install-just
      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-packager
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msi
      - name: Build MSI
        run: just package-windows-msi
      - name: Verify MSI install and uninstall
        run: just --yes test-windows-msi
      - name: Upload MSI verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-transformer-windows-msi-verification-logs
          path: target/msi-verification/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: clipboard-transformer-windows-msi
          path: target/packager/*.msi
          if-no-files-found: error
