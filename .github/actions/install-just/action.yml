name: Install just
description: >-
  Install a pinned `just` release binary through extractions/setup-just, as
  the just manual recommends. It needs no Rust toolchain, so the Flatpak
  container uses it too. Workflows run Justfile recipes so the build and
  verification commands have exactly one definition.
inputs:
  version:
    description: just version to install (the single pinned default)
    required: false
    default: "1.57.0"
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: ${{ inputs.version }}
