name: Check release version
description: >-
  Verify the release version matches Cargo.toml, packaging manifests, and
  optionally the macOS Info.plist (macOS runners only).
inputs:
  version:
    description: >-
      Expected release version. Empty checks the manifests against the
      Cargo.toml workspace version, as pull-request builds do.
    required: false
    default: ""
  info-plist:
    description: >-
      Optional path to a macOS Info.plist whose CFBundleShortVersionString and
      CFBundleVersion must also match. Requires a macOS runner (PlistBuddy).
    required: false
    default: ""
outputs:
  version:
    description: The checked version
    value: ${{ steps.check.outputs.version }}
runs:
  using: composite
  steps:
    - name: Check version consistency
      id: check
      shell: bash
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
        INFO_PLIST: ${{ inputs.info-plist }}
      run: |
        set -euo pipefail
        # The first `version` key is [workspace.package], which every crate
        # inherits. Reading it with sed keeps this usable in jobs without a
        # Rust toolchain, such as the Flatpak container.
        cargo_version="$(
          sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1
        )"
        version="${EXPECTED_VERSION:-${cargo_version}}"
        packager_version="$(
          sed -nE 's/^version = "([^"]+)"$/\1/p' Packager.toml
        )"
        linux_packager_version="$(
          sed -nE 's/^version = "([^"]+)"$/\1/p' package/linux/Packager.toml
        )"
        flatpak_version="$(
          sed -nE 's/.*<release version="([^"]+)" date="[^"]+".*/\1/p' \
            package/flatpak/dev.jagk.clipboard_transformer.metainfo.xml
        )"
        if [[ "${version}" != "${cargo_version}" \
          || "${version}" != "${packager_version}" \
          || "${version}" != "${linux_packager_version}" \
          || "${version}" != "${flatpak_version}" ]]; then
          echo "Release (${version}), Cargo.toml (${cargo_version}), Packager.toml (${packager_version}), Linux Packager.toml (${linux_packager_version}), and Flatpak metadata (${flatpak_version}) versions must match" >&2
          exit 1
        fi
        if [[ -n "${INFO_PLIST}" ]]; then
          plist_short_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${INFO_PLIST}"
          )"
          plist_bundle_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${INFO_PLIST}"
          )"
          if [[ "${version}" != "${plist_short_version}" || "${version}" != "${plist_bundle_version}" ]]; then
            echo "Release (${version}), CFBundleShortVersionString (${plist_short_version}), and CFBundleVersion (${plist_bundle_version}) must match" >&2
            exit 1
          fi
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
