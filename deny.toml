# cargo-deny configuration. Run with `just check-deny`; CI runs the same checks.
#
# Keep this file boring. If a check starts failing, the answer is normally to
# update or drop the dependency, not to widen an allow list here.

[graph]
# Only targets the project actually ships. Without this, the license and
# advisory sets include crates for platforms that are never built.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
]
# Extism 1.30.0 pins Wasmtime to the 43.x line, and Wasmtime publishes
# advisories faster than Extism releases. Leave out exactly the Wasmtime build
# that Extism resolves to, together with the crates only Wasmtime pulls in
# (Cranelift, wasm-compose and its archived data-structure crates). Extism
# itself, wasi-common, wiggle, and every shared crate are still checked.
# The exclusion also skips licenses, bans, and sources for that subtree.
#
# The spec must be an exact version: cargo-deny ignores version ranges and
# partial versions here. Any Wasmtime change (an Extism upgrade or a 43.0.x
# patch) stops the match and brings the subtree back under every check.
# Review that release before updating this line, never copy it forward.
exclude = ["wasmtime@43.0.2"]

[advisories]
version = 2
yanked = "deny"
# Every entry needs a reason and must be re-checked, not inherited forever.
# Advisories in the pinned Wasmtime build are covered by `graph.exclude` above.
ignore = []

[licenses]
version = 2
# The application is MPL-2.0 and is distributed as signed binaries, so every
# dependency must be usable under a permissive license. Several crates in the
# tree are dual-licensed with a copyleft option (`ittapi` is
# `GPL-2.0-only OR BSD-3-Clause`, `r-efi` offers `LGPL-2.1-or-later`); the
# copyleft halves are deliberately absent below so the permissive alternative is
# the one selected. Do not add a GPL or LGPL entry to make a build pass.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning, not an error: a 500-crate graph that pulls
# in wasmtime and three platform binding stacks always has some, and failing on
# them would mean pinning transitive dependencies the project does not own.
multiple-versions = "warn"
# The workspace crates depend on each other by path with no version requirement,
# which reads as a wildcard. Only those are exempt; a wildcard on a published
# crate is still an error.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
