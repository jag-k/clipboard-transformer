# cargo-deny configuration. Run with `just check-deny`; CI runs the same checks.
#
# Keep this file boring. If a check starts failing, the answer is normally to
# update or drop the dependency, not to widen an allow list here.

[graph]
# Only targets the project actually ships. Without this, the license and
# advisory sets include crates for platforms that are never built.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
]

[advisories]
version = 2
yanked = "deny"
# Every entry needs a reason and must be re-checked, not inherited forever.
ignore = [
  # Wasmtime is reached only through the Extism plugin runtime. Extism 1.30
  # pins Wasmtime to the vulnerable 43.x line; the advisory is low severity
  # and its fixes start at 46.0.2, so no compatible Cargo update exists yet.
  # Keep this as a warning until Extism publishes a compatible Wasmtime upgrade.
  { id = "RUSTSEC-2026-0222", reason = "low-severity Wasmtime advisory in transitive Extism runtime; no patched Extism-compatible version is available" },
  # RUSTSEC-2026-0269 is a filesystem sandbox escape for WASI guests that are
  # granted preopened directories. Clipboard Transformer does not put allowed
  # paths in the Extism manifest, so plugins receive no filesystem directories
  # to escape from. Extism 1.30 still pins Wasmtime 43.x; remove this exception
  # as soon as Extism supports a patched Wasmtime release (46.0.3 or newer).
  { id = "RUSTSEC-2026-0269", reason = "Wasmtime filesystem sandbox escape is unreachable because plugins receive no preopened directories; Extism 1.30 has no compatible patched Wasmtime" },
  # wasm-compose is reached only through Wasmtime in the Extism plugin runtime.
  # Its persistent data structures use three crates that were archived together.
  # These advisories are informational and none of the crates has a patched
  # release, so no compatible Cargo update can remove them yet. Drop these
  # entries once Extism/Wasmtime no longer pulls this wasm-compose dependency.
  { id = "RUSTSEC-2026-0247", reason = "unmaintained bitmaps crate in transitive Extism/Wasmtime wasm-compose dependency; no patched release is available" },
  { id = "RUSTSEC-2026-0250", reason = "unmaintained im-rc crate in transitive Extism/Wasmtime wasm-compose dependency; no patched release is available" },
  { id = "RUSTSEC-2026-0251", reason = "unmaintained sized-chunks crate in transitive Extism/Wasmtime wasm-compose dependency; no patched release is available" },
]

[licenses]
version = 2
# The application is MPL-2.0 and is distributed as signed binaries, so every
# dependency must be usable under a permissive license. Several crates in the
# tree are dual-licensed with a copyleft option (`ittapi` is
# `GPL-2.0-only OR BSD-3-Clause`, `r-efi` offers `LGPL-2.1-or-later`); the
# copyleft halves are deliberately absent below so the permissive alternative is
# the one selected. Do not add a GPL or LGPL entry to make a build pass.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning, not an error: a 500-crate graph that pulls
# in wasmtime and three platform binding stacks always has some, and failing on
# them would mean pinning transitive dependencies the project does not own.
multiple-versions = "warn"
# The workspace crates depend on each other by path with no version requirement,
# which reads as a wildcard. Only those are exempt; a wildcard on a published
# crate is still an error.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
