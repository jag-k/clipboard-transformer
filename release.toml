allow-branch = ["main"]
# This virtual workspace has one application version but no root package.
# Keep release orchestration disabled by default and opt one package in via
# `package.metadata.release`; its inherited workspace version still updates
# every member while root-level replacements run exactly once.
release = false
publish = false
push = true
push-remote = "origin"
tag = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
tag-message = "release: {{version}}"

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = 'Unreleased'
replace = '{{version}}'
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '\.\.\.HEAD'
replace = '...v{{version}}'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = 'ReleaseDate'
replace = '{{date}}'
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '<!-- next-header -->'
replace = """
<!-- next-header -->
## [Unreleased] - ReleaseDate
"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '<!-- next-url -->'
replace = """
<!-- next-url -->
[Unreleased]: {{repository}}/compare/v{{version}}...HEAD"""
exactly = 1
prerelease = true


[[pre-release-replacements]]
file = "../../docs/install.md"
search = '(?m)^Direct links below target \*\*v[^*]+\*\*\.'
replace = 'Direct links below target **v{{version}}**.'

[[pre-release-replacements]]
file = "../../docs/install.md"
search = 'releases/download/v[^/]+/(clipboard-transformer(?:-app|-cli)?[-_])\d+\.\d+\.\d+'
replace = 'releases/download/v{{version}}/${1}{{version}}'


[[pre-release-replacements]]
file = "../../Packager.toml"
search = '(?m)^version = "[^"]+"$'
replace = 'version = "{{version}}"'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/linux/Packager.toml"
search = '(?m)^version = "[^"]+"$'
replace = 'version = "{{version}}"'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/flatpak/dev.jag_k.clipboard_transformer.metainfo.xml"
search = '<release version="[^"]+" date="[^"]+" />'
replace = '<release version="{{version}}" date="{{date}}" />'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/macos/Info.plist"
search = '<key>CFBundleShortVersionString</key>\n  <string>[^<]+</string>'
replace = """
<key>CFBundleShortVersionString</key>
  <string>{{version}}</string>"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/macos/Info.plist"
search = '<key>CFBundleVersion</key>\n  <string>[^<]+</string>'
replace = """
<key>CFBundleVersion</key>
  <string>{{version}}</string>"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/homebrew/clipboard-transformer.rb"
search = '(?m)^  version "[^"]+"$'
replace = '  version "{{version}}"'
exactly = 1

[[pre-release-replacements]]
file = "../../package/scoop/clipboard-transformer.json"
search = '(?m)^  "version": "[^"]+",$'
replace = '  "version": "{{version}}",'
exactly = 1

[[pre-release-replacements]]
file = "../../package/scoop/clipboard-transformer.json"
search = 'releases/download/v[^/]+/(clipboard-transformer(?:-app|-cli)?[-_])\d+\.\d+\.\d+'
replace = 'releases/download/v{{version}}/${1}{{version}}'
exactly = 1
