allow-branch = ["main"]
# This virtual workspace has one application version but no root package.
# Keep release orchestration disabled by default and opt one package in via
# `package.metadata.release`; its inherited workspace version still updates
# every member while root-level replacements run exactly once.
release = false
publish = false
push = true
push-remote = "origin"
tag = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
tag-message = "release: {{version}}"

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '## \[Unreleased\] - ReleaseDate'
replace = '## [{{version}}] - {{date}}'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '<!-- next-header -->'
replace = """
<!-- next-header -->
## [Unreleased] - ReleaseDate
"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '(?m)^\[Unreleased\]:.*$'
replace = '[{{version}}]: https://github.com/jag-k/clipboard-transformer/releases/tag/{{tag_name}}'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../CHANGELOG.md"
search = '<!-- next-url -->'
replace = """
<!-- next-url -->
[Unreleased]: https://github.com/jag-k/clipboard-transformer/compare/{{tag_name}}...HEAD"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../Packager.toml"
search = '(?m)^version = "[^"]+"$'
replace = 'version = "{{version}}"'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/linux/Packager.toml"
search = '(?m)^version = "[^"]+"$'
replace = 'version = "{{version}}"'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/macos/Info.plist"
search = '<key>CFBundleShortVersionString</key>\n  <string>[^<]+</string>'
replace = """
<key>CFBundleShortVersionString</key>
  <string>{{version}}</string>"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/macos/Info.plist"
search = '<key>CFBundleVersion</key>\n  <string>[^<]+</string>'
replace = """
<key>CFBundleVersion</key>
  <string>{{version}}</string>"""
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/homebrew/clipboard-transformer.rb"
search = '(?m)^  version "[^"]+"$'
replace = '  version "{{version}}"'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/scoop/clipboard-transformer.json"
search = '(?m)^  "version": "[^"]+",$'
replace = '  "version": "{{version}}",'
exactly = 1
prerelease = true

[[pre-release-replacements]]
file = "../../package/scoop/clipboard-transformer.json"
search = 'releases/download/v[0-9][^/]*/clipboard-transformer-[0-9][^"]*-x86_64-windows-portable\.zip'
replace = 'releases/download/v{{version}}/clipboard-transformer-{{version}}-x86_64-windows-portable.zip'
exactly = 1
prerelease = true
